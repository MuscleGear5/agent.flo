[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrfl"
version = "1.0.0"
description = "Python TUI wrapper for ruflo CLI"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
menu = ["simple-term-menu>=1.6"]

[project.scripts]
pyrfl = "pyrfl.cli:main"
